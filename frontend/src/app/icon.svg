<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="g" x1="12" y1="10" x2="52" y2="54" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FF9654"/>
      <stop offset="1" stop-color="#F5853F"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="15" fill="#130303"/>
  <!-- Orbit and spark share the centre (32,32). The dash gap is what makes
       the ring open, so the circle itself stays perfectly concentric. -->
