          stroke-linecap="round" stroke-dasharray="120.6 30.2"
          transform="rotate(-40 32 32)"/>
  <path d="M 32,13 c 0,10.536 -8.464,19 -19,19 c 10.536,0 19,8.464 19,19
           c 0,-10.536 8.464,-19 19,-19 c -10.536,0 -19,-8.464 -19,-19 Z"
        fill="url(#g)"/>
</svg>
